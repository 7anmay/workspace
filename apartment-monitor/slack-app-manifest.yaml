display_information:
  name: Apartment Monitor
  description: SF apartment availability alerts and search controls.
  background_color: "#2f855a"
features:
  bot_user:
    display_name: Apartment Monitor
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
