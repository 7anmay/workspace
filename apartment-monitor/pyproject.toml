[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-monitor"
version = "0.1.0"
description = "Slack-driven apartment availability monitor for SF searches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "PyYAML",
    "slack-sdk",
]

[project.optional-dependencies]
browser = ["playwright"]
dev = ["pytest"]

[project.scripts]
apartment-monitor = "apartment_monitor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
